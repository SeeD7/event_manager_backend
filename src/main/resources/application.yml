#Global configuration
spring:
  application:
    name: eventManager
  datasource:
    url: jdbc:postgresql://localhost:5432/event-manager
    username: postgres
    password: azertyuiop123
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jpa:
    defer-datasource-initialization: true
